name: Build LuaLoader.dylib (iOS arm64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & patch Lua 5.4.7
        run: |
          mkdir -p build/lua
          curl -fsSL https://www.lua.org/ftp/lua-5.4.7.tar.gz -o lua-5.4.7.tar.gz
          echo "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30  lua-5.4.7.tar.gz" | shasum -a 256 -c -
          tar -xzf lua-5.4.7.tar.gz
          cp lua-5.4.7/src/*.c lua-5.4.7/src/*.h lua-5.4.7/src/lua.hpp build/lua/
          # Keep the library sources; exclude the CLI and amalgamated single-file build.
          rm -f build/lua/lua.c build/lua/luac.c build/lua/onelua.c
          sed -i '' 's/#define l_system(cmd).*/#define l_system(cmd) ((cmd) == NULL ? 0 : -1)/g' build/lua/loslib.c

      - name: Download Dear ImGui v1.91.6
        run: |
          mkdir -p build/imgui/backends
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.6.tar.gz -o imgui.tar.gz
          tar -xzf imgui.tar.gz
          cp imgui-1.91.6/*.cpp imgui-1.91.6/*.h build/imgui/
          cp imgui-1.91.6/backends/imgui_impl_metal.h imgui-1.91.6/backends/imgui_impl_metal.mm build/imgui/backends/

      - name: Download pinned Dobby hook library
        run: |
          mkdir -p build/dobby-src
          curl -fsSL https://codeload.github.com/jmpews/Dobby/tar.gz/5dfc8546954ce3b3198132ab13fddb89ee92cdd7 -o dobby.tar.gz
          tar -xzf dobby.tar.gz --strip-components=1 -C build/dobby-src
          test -s build/dobby-src/include/dobby.h
          test -s build/dobby-src/CMakeLists.txt

      - name: Compile Lua 5.4.7 & Dear ImGui (arm64 iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/obj/lua build/obj/imgui

          for f in build/lua/*.c; do
            name=$(basename "$f" .c)
            clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
              -O2 -DLUA_USE_IOS -Ibuild/lua -c "$f" -o "build/obj/lua/${name}.o"
          done

          for f in build/imgui/imgui.cpp build/imgui/imgui_draw.cpp build/imgui/imgui_tables.cpp build/imgui/imgui_widgets.cpp; do
            name=$(basename "$f" .cpp)
            clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
              -std=c++17 -O2 -Ibuild/imgui -c "$f" -o "build/obj/imgui/${name}.o"
          done

          clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -std=c++17 -fobjc-arc -O2 -Ibuild/imgui -Ibuild/imgui/backends \
            -c build/imgui/backends/imgui_impl_metal.mm -o build/obj/imgui/imgui_impl_metal.o

      - name: Build Dobby static library for iOS arm64
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -S build/dobby-src -B build/dobby \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_BUILD_SILICON=ON \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_DEBUG=OFF \
            -DNearBranch=ON \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF
          cmake --build build/dobby --config Release --target dobby_static --parallel
          test -s build/dobby/libdobby.a
          file build/dobby/libdobby.a

      - name: Build LuaLoader.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib -std=c++17 -fobjc-arc -O2 \
            -install_name @executable_path/Frameworks/LuaLoader.dylib \
            -Ibuild/lua -Ibuild/imgui -Ibuild/imgui/backends -Ibuild/dobby-src/include \
            src/loader.mm build/obj/lua/*.o build/obj/imgui/*.o build/dobby/libdobby.a \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework Metal \
            -framework MetalKit \
            -framework UserNotifications \
            -o LuaLoader.dylib

      - name: Ad-hoc sign & verify dylib
        run: |
          codesign --force --sign - --timestamp=none LuaLoader.dylib
          codesign --verify --strict LuaLoader.dylib
          lipo LuaLoader.dylib -verify_arch arm64
          codesign -dv --verbose=4 LuaLoader.dylib
          otool -L LuaLoader.dylib

      - name: Package dylib with bundled Lua modules
        run: |
          mkdir -p build/package/Frameworks
          cp LuaLoader.dylib build/package/Frameworks/
          cp -R LoaderLib build/package/
          (cd build/package && zip -qr "$GITHUB_WORKSPACE/LuaLoader-ios-arm64-package.zip" Frameworks LoaderLib)
          unzip -l LuaLoader-ios-arm64-package.zip

      - name: Upload LuaLoader.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaLoader-ios-arm64
          path: LuaLoader.dylib

      - name: Upload LuaLoader package
        uses: actions/upload-artifact@v4
        with:
          name: LuaLoader-ios-arm64-package
          path: LuaLoader-ios-arm64-package.zip
