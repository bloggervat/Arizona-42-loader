name: Build LuaLoader.dylib (iOS arm64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & patch Lua 5.4.7 for iOS
        run: |
          mkdir -p build/lua build/imgui
          curl -fsSL https://www.lua.org/ftp/lua-5.4.7.tar.gz -o lua-5.4.7.tar.gz
          tar -xzf lua-5.4.7.tar.gz
          python3 -c '
          p = "lua-5.4.7/src/loslib.c"
          s = open(p, "r", encoding="utf-8").read()
          s = s.replace("int stat = system(cmd);", "int stat = (cmd == NULL) ? 0 : -1;")
          open(p, "w", encoding="utf-8").write(s)
          '

      - name: Download Dear ImGui v1.91.6
        run: |
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.6.tar.gz -o imgui.tar.gz
          tar -xzf imgui.tar.gz

      - name: Compile Lua 5.4.7 & Dear ImGui (arm64 iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          for f in lua-5.4.7/src/*.c; do
            base=$(basename "$f")
            if [ "$base" != "lua.c" ] && [ "$base" != "luac.c" ]; then
              clang -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=14.0 \
                -O2 \
                -DLUA_USE_IOS \
                -c "$f" -o "build/lua/${base%.c}.o"
            fi
          done

          for f in imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp; do
            clang++ -arch arm64 \
              -isysroot "$SDK" \
              -miphoneos-version-min=14.0 \
              -std=c++17 \
              -O2 \
              -Iimgui-1.91.6 \
              -c "imgui-1.91.6/$f" -o "build/imgui/${f%.cpp}.o"
          done

          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -O2 \
            -Iimgui-1.91.6 \
            -Iimgui-1.91.6/backends \
            -c "imgui-1.91.6/backends/imgui_impl_metal.mm" \
            -o "build/imgui/imgui_impl_metal.o"

      - name: Build LuaLoader.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -install_name @executable_path/Frameworks/LuaLoader.dylib \
            -Ilua-5.4.7/src \
            -Iimgui-1.91.6 \
            -Iimgui-1.91.6/backends \
            build/lua/*.o \
            build/imgui/*.o \
            src/*.mm \
            -o build/LuaLoader.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework UserNotifications \
            -framework QuartzCore \
            -framework Metal \
            -framework MetalKit

      - name: Ad-hoc sign & verify dylib
        run: |
          codesign --force --sign - build/LuaLoader.dylib
          otool -L build/LuaLoader.dylib

      - name: Upload LuaLoader.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaLoader-ios-arm64
          path: build/LuaLoader.dylib
